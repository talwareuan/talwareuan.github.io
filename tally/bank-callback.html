<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Returning to Tally</title>
<style>html,body{background:#000;color:#F2F2F2;font-family:system-ui,sans-serif;margin:0;height:100%;display:flex;align-items:center;justify-content:center}a{color:#E0B861}</style></head>
<body><p id="m">Returning to Tally…</p>
<script>
// Static relay: forwards the bank authorisation result to the Tally app. Stores and sends nothing.
var target = "tally://bank-callback" + window.location.search;
window.location.replace(target);
setTimeout(function(){ document.getElementById("m").innerHTML = '<a href="' + target.replace(/"/g,"") + '">Open Tally</a>'; }, 1500);
</script></body></html>
