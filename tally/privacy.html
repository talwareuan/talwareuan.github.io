<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tally Privacy</title></head><body style="background:#000;color:#F2F2F2;font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px"><h1>Tally Privacy</h1><p>Tally is a personal app used only by its owner. Bank data is read with the owner's consent, stored encrypted on the owner's phone, and is never shared or sold. The owner can revoke access at any time in the app or with the bank.</p></body></html>
